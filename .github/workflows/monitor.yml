# 보유 종목 논리 점검 — 자동 실행
#
# 평일 아침에 자동으로 돌려 메일을 보낸다.
# Codespace를 켜지 않아도 된다.
#
# 설정 (저장소 Settings > Secrets and variables > Actions > New repository secret)
#   SMTP_USER   보내는 Gmail 주소
#   SMTP_PASS   Gmail 앱 비밀번호 16자리 (띄어쓰기 없이)
#   SEC_UA      "Solmin Kim your@email.com" — 한글 금지(HTTP 헤더는 latin-1만 허용)
#
#   ※ Codespaces Secret과 Actions Secret은 별개다. 둘 다 등록해야 한다.

name: 보유 종목 논리 점검

on:
  schedule:
    # UTC 기준. 22:00 UTC = 한국 07:00
    # 미국장 마감(한국 05:00~06:00) 이후라 전날 뉴스·공시가 반영된다.
    - cron: "0 22 * * 0-4"   # 일~목 22:00 UTC = 월~금 07:00 KST
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myagent

    steps:
      - uses: actions/checkout@v4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: 설정 확인
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          # 값은 찍지 않는다. 존재 여부와 길이만 본다.
          [ -n "$SMTP_USER" ] || { echo "::error::SMTP_USER 미설정"; exit 1; }
          [ -n "$SMTP_PASS" ] || { echo "::error::SMTP_PASS 미설정"; exit 1; }
          [ -n "$SEC_UA" ]    || echo "::warning::SEC_UA 미설정 — 공시 수집이 안 될 수 있음"
          echo "앱 비밀번호 길이: ${#SMTP_PASS} (16이어야 정상)"
          if [ "${#SMTP_PASS}" -ne 16 ]; then
            echo "::warning::16자가 아닙니다. 띄어쓰기가 섞였을 수 있습니다."
          fi

      - name: 실행 및 발송
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python -m monitor.run

      - name: 실행 로그 남기기
        if: always()
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          # 메일 발송과 별개로 Actions 요약에도 남긴다.
          # 메일이 스팸함에 가거나 발송이 실패해도 여기서 볼 수 있다.
          mkdir -p reports
          python -m monitor.run --dry > "reports/$(date +%F).txt" 2>&1 || true
          {
            echo '## 보유 종목 논리 점검'
            echo '```'
            cat "reports/$(date +%F).txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: reports/
          retention-days: 30
